name: Generate Chinese copy
on:
  push:
    branches: [codex/chinese-copy-build]
permissions:
  contents: read
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        part: [0, 1, 2, 3]
    env:
      COPY_PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
      - run: pip install 'transformers==4.53.3' sentencepiece sacremoses
      - run: python .translation-build/translate.py
      - uses: actions/upload-artifact@v4
        with:
          name: chinese-copy-${{ matrix.part }}
          path: zh-CN-${{ matrix.part }}.json
