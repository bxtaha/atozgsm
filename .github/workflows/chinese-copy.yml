name: Probe alternative translation
on:
  push:
    branches: [codex/chinese-copy-build]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for url in             'https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=en&tl=zh-CN&q=Get%20my%20brief'             'https://translate.google.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q=Get%20my%20brief'             'https://translate.google.com/m?sl=en&tl=zh-CN&q=Get%20my%20brief'             'https://api.mymemory.translated.net/get?q=Get%20my%20brief&langpair=en%7Czh-CN'             'https://translate.googleapis.com/translate_a/t?client=te_lib&sl=en&tl=zh-CN&q=Get%20my%20brief'; do
            echo "$url"
            curl -sSL --max-time 8 "$url" | head -c 350
            echo
          done
